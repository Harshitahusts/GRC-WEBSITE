# GRC-Flow on one server: website, GRC agent app, demo workspace and Caddy
# (HTTPS) in front. See deploy/README.md for the Oracle Cloud walkthrough.
#
#   grc-flow.com, www  ->  website  (this repo)
#   app.grc-flow.com   ->  app      (GRC agent, your real workspace)
#   demo.grc-flow.com  ->  demo     (GRC agent demo workspace, embedded on /demo)

name: grcflow

services:
  website:
    build:
      context: ..
      args:
        NEXT_PUBLIC_APP_DEMO_URL: https://demo.${SITE_DOMAIN:?set SITE_DOMAIN in .env}
    restart: unless-stopped

  app:
    image: grcflow/grc-agent:latest
    build:
      # The GRC-Ai repo, fetched by Docker. Set GRC_AI_CONTEXT to a local
      # folder (e.g. ../../GRC-Ai) to build from your own checkout instead.
      context: ${GRC_AI_CONTEXT:-https://github.com/Harshitahusts/GRC-Ai.git#main}
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GRC_SECURE_COOKIES: "1"
    volumes:
      - grc-data:/data
    restart: unless-stopped

  demo:
    # Same image as `app`, running the demo tenant with sample data on its own volume.
    image: grcflow/grc-agent:latest
    depends_on:
      - app
    # The first step fills the demo with sample clients by signing in over plain
    # http inside the container, so it runs without HTTPS-only cookies (it only
    # seeds on first start). The second step serves the demo with them on.
    command:
      - sh
      - -c
      - GRC_SECURE_COOKIES=0 grc-web demo --dir /data --seed-only && exec grc-web demo --dir /data --lan --port 8001
    environment:
      # Simulated AI answers, so public visitors can't spend your API credits.
      GRC_AI_MODE: demo
      GRC_SECURE_COOKIES: "1"
    volumes:
      - grc-demo:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz')"]
      interval: 30s
      timeout: 3s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - website
      - app
      - demo
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  grc-data:     # real workspace: back this up
  grc-demo:     # demo tenant: safe to delete, it re-seeds
  caddy-data:   # HTTPS certificates
  caddy-config:
